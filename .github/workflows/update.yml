name: Update data from the site
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest CSV files
        run: |
          for f in crop-yields.csv crop-prices.csv crop-production.csv; do
            if ! curl -fsSL --retry 2 -A "data-sync (+https://github.com/2217040/us-crop-yields-prices-by-state)" "https://greenmatrix.digital/data/$f" -o "data/$f.new"; then echo "::warning::$f could not be downloaded, keeping the old file"; rm -f "data/$f.new"; continue; fi
            if [ "$(wc -l < "data/$f.new")" -gt 5 ]; then mv "data/$f.new" "data/$f"; else echo "$f too short, keeping the old file"; rm "data/$f.new"; fi
          done
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update data from the site ($(date -u +%Y-%m-%d))" && git push; fi
